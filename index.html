<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAKIMAX MOVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101014;color:white;font-family:Arial,sans-serif}
header{background:#e50914;padding:22px 12px;text-align:center}
header h1{margin:0;font-size:30px;letter-spacing:2px}
header p{margin:8px 0 0}
.search{display:block;width:90%;max-width:500px;margin:22px auto;padding:13px;border:0;border-radius:8px;font-size:16px}
h2{text-align:center}
.movies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px;max-width:900px;margin:auto}
.card{background:#202027;border-radius:10px;overflow:hidden;text-align:center;padding-bottom:14px}
.poster{height:145px;background:#30303a;display:flex;align-items:center;justify-content:center;font-size:48px}
.card h3{font-size:16px;padding:0 5px}
.card p{color:#bbb;font-size:13px}
button{background:#e50914;color:white;border:0;border-radius:6px;padding:10px 18px;font-weight:bold}
footer{text-align:center;padding:25px;color:#aaa;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🎬 LAKIMAX MOVE</h1>
<p>Your Movie Entertainment Zone</p>
</header>
<input class="search" id="search" placeholder="🔍 Search movies..." oninput="findMovies()">
<h2>🍿 Latest Movies</h2>
<div class="movies" id="movies">
<div class="card">
<div class="poster">🎬</div>
<h3>Welcome to LAKIMAX MOVE</h3>
<p>Your movie website starts here!</p>
</div>
</div>
<footer>© LAKIMAX MOVE</footer>
<script>
function findMovies(){
const q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.card').forEach(card=>{
card.style.display=card.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
  <div style="background:#222;color:white;padding:15px;border-radius:10px;margin:20px 0;">
  <h2>🎬 LAKIMAX MOVE</h2>
  <p>පළමු වීඩියෝව</p>
  <iframe
    src="https://drive.google.com/file/d/1II-LmU-bskCZ2B59QyfMgLxAB2BDAG2s/preview"
    width="100%"
    height="300"
    allow="autoplay"
    allowfullscreen>
  </iframe>
</div>
</body>
</html>
